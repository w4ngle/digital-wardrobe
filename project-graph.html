<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Wardrobe — Architecture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #0B0E14;
      color: #F8FAFC;
      overflow: hidden;
    }
    #canvas {
      width: 100vw;
      height: 100vh;
    }
    .controls {
      position: fixed;
      top: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(12px);
      max-width: 280px;
    }
    .controls h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #F8FAFC;
    }
    .controls p {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #CBD5E1;
    }
    .legend-box {
      width: 32px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid;
      flex-shrink: 0;
    }
    .stats {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      font-size: 12px;
      color: #94A3B8;
      display: flex;
      gap: 24px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #38BDF8;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748B;
    }
    .hint {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      font-size: 11px;
      color: #64748B;
    }
    .tooltip {
      position: fixed;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid #38BDF8;
      border-radius: 8px;
      padding: 12px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 12px;
      max-width: 300px;
      z-index: 100;
    }
    .tooltip.visible {
      opacity: 1;
    }
    .tooltip h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #F8FAFC;
    }
    .tooltip p {
      color: #94A3B8;
      line-height: 1.5;
      margin: 0;
    }
    .tooltip .file-path {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      color: #38BDF8;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <h1>Цифровой гардероб</h1>
    <p>Next.js + Supabase + React 19</p>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-box" style="background: #1E3A8A; border-color: #3B82F6;"></div>
        <span>UI компоненты</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background: #064E3B; border-color: #10B981;"></div>
        <span>API слой</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background: #7C2D12; border-color: #F97316;"></div>
        <span>База данных</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background: #374151; border-color: #9CA3AF;"></div>
        <span>Страницы</span>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value">8</div>
      <div class="stat-label">Файлов</div>
    </div>
    <div class="stat">
      <div class="stat-value">15</div>
      <div class="stat-label">Связей</div>
    </div>
    <div class="stat">
      <div class="stat-value">3</div>
      <div class="stat-label">Слоёв</div>
    </div>
  </div>

  <div class="hint">
    Наведите курсор на узел для подробностей
  </div>

  <div class="tooltip" id="tooltip">
    <h3 id="tooltip-title"></h3>
    <p id="tooltip-desc"></p>
    <div class="file-path" id="tooltip-path"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const nodes = [
      { id: 'page', label: 'page.tsx', type: 'page', x: 0.5, y: 0.15, desc: 'Главная страница приложения', path: 'app/page.tsx' },
      { id: 'layout', label: 'layout.tsx', type: 'page', x: 0.5, y: 0.05, desc: 'Корневой layout с метаданными', path: 'app/layout.tsx' },
      { id: 'itemForm', label: 'ItemForm', type: 'component', x: 0.25, y: 0.35, desc: 'Форма для добавления вещей', path: 'components/ItemForm.tsx' },
      { id: 'itemCard', label: 'ItemCard', type: 'component', x: 0.75, y: 0.35, desc: 'Карточка отображения вещи', path: 'components/ItemCard.tsx' },
      { id: 'api', label: 'api.ts', type: 'api', x: 0.5, y: 0.55, desc: 'CRUD операции для вещей', path: 'lib/api.ts' },
      { id: 'supabase', label: 'supabase.ts', type: 'api', x: 0.5, y: 0.75, desc: 'Supabase клиент и типы', path: 'lib/supabase.ts' },
      { id: 'items', label: 'items', type: 'database', x: 0.35, y: 0.92, desc: 'Таблица вещей гардероба', path: 'supabase-schema.sql' },
      { id: 'outfits', label: 'outfits', type: 'database', x: 0.65, y: 0.92, desc: 'Таблица образов', path: 'supabase-schema.sql' }
    ];

    const edges = [
      { from: 'layout', to: 'page' },
      { from: 'page', to: 'itemForm' },
      { from: 'page', to: 'itemCard' },
      { from: 'page', to: 'api' },
      { from: 'itemForm', to: 'api' },
      { from: 'itemCard', to: 'api' },
      { from: 'api', to: 'supabase' },
      { from: 'supabase', to: 'items' },
      { from: 'supabase', to: 'outfits' }
    ];

    const colors = {
      component: { bg: '#1E3A8A', border: '#3B82F6', glow: 'rgba(59, 130, 246, 0.4)' },
      api: { bg: '#064E3B', border: '#10B981', glow: 'rgba(16, 185, 129, 0.4)' },
      database: { bg: '#7C2D12', border: '#F97316', glow: 'rgba(249, 115, 22, 0.4)' },
      page: { bg: '#374151', border: '#9CA3AF', glow: 'rgba(156, 163, 175, 0.4)' }
    };

    nodes.forEach(node => {
      node.px = node.x * canvas.width;
      node.py = node.y * canvas.height;
      node.vx = 0;
      node.vy = 0;
      node.hover = false;
    });

    let hoveredNode = null;

    function drawEdge(from, to, alpha = 1) {
      const gradient = ctx.createLinearGradient(from.px, from.py, to.px, to.py);
      gradient.addColorStop(0, `rgba(56, 189, 248, ${0.2 * alpha})`);
      gradient.addColorStop(1, `rgba(56, 189, 248, ${0.5 * alpha})`);

      ctx.strokeStyle = gradient;
      ctx.lineWidth = hoveredNode && (hoveredNode === from.id || hoveredNode === to.id) ? 2.5 : 1.5;
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.moveTo(from.px, from.py);

      const midX = (from.px + to.px) / 2;
      const midY = (from.py + to.py) / 2;
      const offset = 40;
      const cpX = midX + (from.py > to.py ? offset : -offset);
      const cpY = midY;

      ctx.quadraticCurveTo(cpX, cpY, to.px, to.py);
      ctx.stroke();

      const arrowSize = 8;
      const angle = Math.atan2(to.py - cpY, to.px - cpX);
      ctx.fillStyle = `rgba(56, 189, 248, ${0.6 * alpha})`;
      ctx.beginPath();
      ctx.moveTo(to.px, to.py);
      ctx.lineTo(
        to.px - arrowSize * Math.cos(angle - Math.PI / 6),
        to.py - arrowSize * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        to.px - arrowSize * Math.cos(angle + Math.PI / 6),
        to.py - arrowSize * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function drawNode(node) {
      const color = colors[node.type];
      const radius = 60;

      if (node.hover) {
        ctx.shadowColor = color.glow;
        ctx.shadowBlur = 20;
      }

      ctx.fillStyle = color.bg;
      ctx.strokeStyle = color.border;
      ctx.lineWidth = node.hover ? 2.5 : 1.5;

      ctx.beginPath();
      ctx.roundRect(node.px - radius, node.py - 24, radius * 2, 48, 8);
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;

      ctx.fillStyle = '#F8FAFC';
      ctx.font = node.hover ? '600 13px Inter' : '500 13px Inter';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(node.label, node.px, node.py);
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      edges.forEach(edge => {
        const from = nodes.find(n => n.id === edge.from);
        const to = nodes.find(n => n.id === edge.to);
        drawEdge(from, to);
      });

      nodes.forEach(node => {
        node.py += Math.sin(Date.now() / 1000 + node.x * 10) * 0.3;
        drawNode(node);
      });

      requestAnimationFrame(animate);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      let found = false;
      nodes.forEach(node => {
        const dx = mouseX - node.px;
        const dy = mouseY - node.py;
        const dist = Math.sqrt(dx * dx + dy * dy);
        node.hover = dist < 60;
        if (node.hover) {
          found = true;
          hoveredNode = node.id;
          tooltip.classList.add('visible');
          document.getElementById('tooltip-title').textContent = node.label;
          document.getElementById('tooltip-desc').textContent = node.desc;
          document.getElementById('tooltip-path').textContent = node.path;
          tooltip.style.left = e.clientX + 20 + 'px';
          tooltip.style.top = e.clientY + 20 + 'px';
        }
      });

      if (!found) {
        hoveredNode = null;
        tooltip.classList.remove('visible');
      }

      canvas.style.cursor = found ? 'pointer' : 'default';
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      nodes.forEach(node => {
        node.px = node.x * canvas.width;
        node.py = node.y * canvas.height;
      });
    });

    animate();
  </script>
</body>
</html>
